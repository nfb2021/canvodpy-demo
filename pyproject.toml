[project]
name = "canvodpy-demo"
version = "0.1.0"
description = "Interactive marimo notebooks for the canVODpy GNSS-T VOD retrieval ecosystem"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = [
    # ── Pre-release ──────────────────────────────────────────────────────────
    # canvodpy is not yet on PyPI. Install from a local clone:
    #
    #   git clone https://github.com/nfb2021/canvodpy.git ../canvodpy
    #   # then uncomment the line below and run: uv sync
    #
    # "canvodpy @ ../canvodpy",
    #
    # ── PyPI (once published) ────────────────────────────────────────────────
    # Replace the local path above with the versioned PyPI release:
    #
    # "canvodpy>=<version>",
    #
    # ────────────────────────────────────────────────────────────────────────
    "marimo>=0.21.1",
]

[project.urls]
Homepage = "https://github.com/nfb2021/canvodpy-demo"
Repository = "https://github.com/nfb2021/canvodpy-demo"
"Bug Tracker" = "https://github.com/nfb2021/canvodpy/issues"
Documentation = "https://nfb2021.github.io/canvodpy/"
